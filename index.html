<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome to my website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #fff5f7;
            color: #805966;
        }

        /* Navigatiebalk */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            margin: 16px 22px;
            padding: 16px 22px;
            background: rgba(249, 220, 228, 0.95);
            border: 1px solid #f3cbd7;
            border-radius: 18px;
            box-shadow: 0 8px 22px rgba(150, 100, 115, 0.12);
        }

        nav a {
            color: #805966;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #c27691;
        }

        .nav-title {
            text-align: center;
            flex: 1;
        }

        /* Zoekbalk */
        .search {
            display: flex;
            align-items: center;
            border: 1px solid #e9bdcb;
            border-radius: 30px;
            padding: 8px 12px;
            background: #fff9e5;
        }

        .search input {
            width: 135px;
            border: none;
            outline: none;
            background: transparent;
            color: #805966;
            font-size: 13px;
        }

        .search button {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 17px;
        }

        /* Introductieblok */
        .intro {
            width: min(585px, calc(100% - 36px));
            margin: 98px auto 50px;
            padding: 42px 38px;
            text-align: center;
            background: #f6dce4;
            border: 2px solid #f2cbd8;
            border-radius: 24px;
            box-shadow: 0 16px 35px rgba(150, 100, 115, 0.16);
        }

        .intro h1 {
            margin: 0 0 26px;
            color: #925d70;
            font-size: 36px;
        }

        .intro .welcome {
            margin-bottom: 22px;
            color: #9a6878;
        }

        .intro p {
            line-height: 1.8;
            font-size: 15px;
        }

        /* Knop */
        .button {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 26px;
            border: 1px solid #e7d58d;
            border-radius: 30px;
            background: #fff0b8;
            color: #806343;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s, transform 0.2s;
        }

        .button:hover {
            background: #f7e49b;
            transform: translateY(-2px);
        }

        /* Mobiele weergave */
        @media (max-width: 650px) {
            nav {
                justify-content: center;
                margin: 12px;
                padding: 18px;
            }

            nav a,
            .nav-title {
                flex: auto;
                text-align: center;
            }

            .search {
                width: 100%;
                justify-content: space-between;
            }

            .search input {
                width: 100%;
            }

            .intro {
                margin-top: 55px;
                padding: 32px 22px;
            }

            .intro h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="pagina2.html">pagina 2</a>

        <a href="pagina3.html">pagina 3</a>

        <a href="index.html" class="nav-title">
            Welcome to my website
        </a>

        <form class="search" action="index.html" method="get">
            <input
                type="search"
                name="q"
                placeholder="Search..."
                aria-label="Zoeken"
            >
            <button type="submit" aria-label="Zoeken">🔍</button>
        </form>
    </nav>

    <main>
        <section class="intro">
            <h1>Introduction</h1>

            <p class="welcome">
                Welcome to my website!
            </p>

            <p>
                Dit is mijn persoonlijke website. Hier kun je meer
                informatie vinden over mij, mijn projecten en mijn interesses.
            </p>

            <a href="pagina3.html" class="button">
                Learn More
            </a>
        </section>
    </main>

</body>
</html>
