<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina 4 - Pink & Butter Yellow</title>

  <style>
    :root {
      --pink: #F8C9D4;
      --butter: #FFF0A8;
      --cream: #FFF9F5;
      --dusty: #DDA6B5;
      --text: #634A50;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: var(--cream);
      color: var(--text);
    }

    header {
      padding: 25px;
      text-align: center;
      background: var(--pink);
    }

    nav {
      padding: 16px;
      text-align: center;
      background: white;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .hero {
      background: var(--butter);
      border-radius: 25px;
      padding: 45px 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 36px;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 30px;
    }

    .color {
      padding: 30px 20px;
      border-radius: 18px;
    }

    .pink { background: var(--pink); }
    .yellow { background: var(--butter); }
    .cream { background: white; }
    .dusty { background: var(--dusty); }

    .home-button {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 24px;
      border-radius: 25px;
      background: var(--pink);
      color: var(--text);
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      background: var(--pink);
      text-align: center;
    }

    @media (max-width: 550px) {
      .palette {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>♡ My Pastel World ♡</h1>
    <p>Pagina 4 — Mijn kleurenmodel</p>
  </header>

  <nav>
    <a href="index.html">⌂ Terug naar homepage</a>
  </nav>

  <main>
    <section class="hero">
      <h2>Pink & Butter Yellow 🎀</h2>
      <p>Een zachte, lieve en zonnige kleurencombinatie.</p>
      <a class="home-button" href="index.html">
        Terug naar home ♡
      </a>
    </section>

    <section class="palette">
      <div class="color pink">
        <h3>Light Pink 🌸</h3>
        <p>#F8C9D4</p>
      </div>

      <div class="color yellow">
        <h3>Butter Yellow ☀️</h3>
        <p>#FFF0A8</p>
      </div>

      <div class="color cream">
        <h3>Cream White ☁️</h3>
        <p>#FFF9F5</p>
      </div>

      <div class="color dusty">
        <h3>Dusty Pink 🌷</h3>
        <p>#DDA6B5</p>
      </div>
    </section>
  </main>

  <footer>
    Made with love ♡
  </footer>
</body>
</html>
